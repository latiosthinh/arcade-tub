<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Hydraulic Crush - Satisfying ASMR Antistress</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #1e272e;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px;
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        pointer-events: auto;
      }
      .hud-btn {
        background: #2f3542;
        color: #f1c40f;
        border: 2px solid #f1c40f;
        border-radius: 8px;
        padding: 8px 16px;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .hud-btn:active {
        transform: scale(0.96);
      }
      .bottom-bar {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }
      #btn-crush-hold {
        background: #e74c3c;
        color: #ffffff;
        border: 3px solid #c0392b;
        border-radius: 40px;
        padding: 14px 48px;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        box-shadow: 0 6px 12px rgba(231, 76, 60, 0.4);
        cursor: pointer;
        touch-action: none;
      }
      #btn-crush-hold:active {
        background: #c0392b;
        transform: scale(0.95);
      }
      #item-carousel {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        max-width: 90vw;
        padding: 6px;
        background: rgba(47, 53, 66, 0.85);
        border-radius: 12px;
        backdrop-filter: blur(4px);
      }
      .item-btn {
        background: #57606f;
        color: #f1f2f6;
        border: 1px solid #747d8c;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
      }
      .item-btn.active {
        background: #f1c40f;
        color: #2f3542;
        border-color: #f39c12;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="ui-overlay">
      <div class="top-bar">
        <a href="../../" class="hud-btn" style="text-decoration: none;">&larr; HUB</a>
        <div style="display: flex; gap: 8px;">
          <button id="btn-reset" class="hud-btn">RESET</button>
          <button id="btn-mute" class="hud-btn">MUTE</button>
        </div>
      </div>

      <div class="bottom-bar">
        <button id="btn-crush-hold">HOLD TO CRUSH</button>
        <div id="item-carousel"></div>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
