<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Bug Climb Tree - Arcade Carnival</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      body,
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #05120e;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: 2 / 3;
        object-fit: contain;
        background-color: #0a1917;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas" width="480" height="720"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
