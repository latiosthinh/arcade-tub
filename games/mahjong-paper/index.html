<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mahjong Paper - Arcade Carnival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Comfortaa:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #FAF6EE;
        background-image: radial-gradient(#2B2118 0.75px, transparent 0.75px), radial-gradient(#2B2118 0.75px, #FAF6EE 0.75px);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        color: #2B2118;
        font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-container {
        position: relative;
        width: 800px;
        height: 600px;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
        box-shadow: 4px 4px 0px #2B2118;
        border: 3px solid #2B2118;
        border-radius: 12px;
        overflow: hidden;
        background: #FAF6EE;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game" width="800" height="600"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
