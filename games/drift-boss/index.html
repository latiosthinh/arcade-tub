<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cardboard Drift - Arcade Carnival</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b1d0c;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Courier New', monospace, sans-serif;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 800px;
        max-height: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
