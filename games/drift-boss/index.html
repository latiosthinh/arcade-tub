<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Cardboard Drift - Arcade Carnival</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&family=Comfortaa:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #FAF6EE;
        background-image: radial-gradient(#2B2118 0.75px, transparent 0.75px), radial-gradient(#2B2118 0.75px, #FAF6EE 0.75px);
        background-size: 24px 24px;
        background-position: 0 0, 12px 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      canvas {
        display: block;
        box-shadow: 4px 4px 0px #2B2118;
        border: 3px solid #2B2118;
        border-radius: 8px;
        background-color: #FAF6EE;
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
