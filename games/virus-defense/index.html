<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Virus Defense - Arcade Carnival</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #05060a;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-container {
        position: relative;
        width: 800px;
        height: 600px;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
        box-shadow: 0 0 40px rgba(6, 182, 212, 0.25);
        border: 2px solid #0e7490;
        border-radius: 8px;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game" width="800" height="600"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
