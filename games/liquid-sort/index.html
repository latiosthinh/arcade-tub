<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Color Water Sort - Antistress Puzzle</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0e0d10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ede8df;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    /* Top HUD Header */
    .hud-header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-header * {
      pointer-events: auto;
    }
    .title-badge {
      background: rgba(28, 25, 34, 0.78);
      backdrop-filter: blur(10px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #dfd8cb;
    }
    .hud-controls {
      display: flex;
      gap: 10px;
    }
    .hud-btn {
      position: relative;
      background: rgba(28, 25, 34, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #eae3d2;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .hud-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .hud-btn:not(:disabled):active {
      transform: scale(0.92);
      background: rgba(45, 40, 55, 0.9);
    }
    .badge-counter {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #007aff;
      color: white;
      font-size: 10px;
      font-weight: bold;
      border-radius: 10px;
      padding: 2px 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    /* Win celebration overlay modal */
    .win-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 9, 14, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 50;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .win-card {
      background: rgba(30, 26, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .win-title {
      font-size: 26px;
      font-weight: 700;
      color: #34c759;
      letter-spacing: 0.5px;
    }
    .win-subtitle {
      font-size: 14px;
      color: #a8a29e;
    }
    .primary-btn {
      background: linear-gradient(135deg, #007aff, #0056b3);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
      transition: all 0.15s ease;
    }
    .primary-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div class="hud-header">
      <div id="levelBadge" class="title-badge">🧪 Level 1</div>
      <div class="hud-controls">
        <button id="undoBtn" class="hud-btn" title="Undo Move">
          ↩️
          <span id="undoCount" class="badge-counter" style="display: none;">0</span>
        </button>
        <button id="restartBtn" class="hud-btn" title="Restart Level">🔄</button>
        <button id="muteBtn" class="hud-btn" title="Toggle Sound">🔊</button>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="winModal" class="win-modal">
      <div class="win-card">
        <div style="font-size: 48px;">🎉✨</div>
        <div class="win-title">Level Complete!</div>
        <div class="win-subtitle">All vibrant liquids harmoniously sorted.</div>
        <button id="nextLevelBtn" class="primary-btn">Next Puzzle ➡️</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
