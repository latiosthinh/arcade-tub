<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type Strike — Arcade Carnival</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg-primary); display: flex; justify-content: center; align-items: center; height: 100vh; position: relative; }
    canvas { display: block; }
    .hub-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      color: var(--neon-pink);
      background: var(--bg-overlay);
      border: 2px solid var(--neon-pink);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      font-weight: bold;
      text-decoration: none;
      box-shadow: var(--glow-pink);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .hub-btn:hover, .hub-btn:focus-visible {
      background: var(--neon-pink);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 0, 127, 0.8);
      outline: 2px solid #ffffff;
    }
  </style>
</head>
<body>
  <a href="../../index.html" class="hub-btn" aria-label="Return to Arcade Carnival Hub">← Arcade Hub</a>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
