<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tank 1990 — Arcade Carnival</title>
  <link rel="stylesheet" href="../../src/styles/tokens.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #FAF6EE;
      background-image: radial-gradient(#2B2118 0.75px, transparent 0.75px), radial-gradient(#2B2118 0.75px, #FAF6EE 0.75px);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      border: 3px solid #2B2118;
      border-radius: 12px;
      box-shadow: 6px 6px 0px #2B2118;
      background: #181512;
      width: min(96vw, calc(96vh * (480 / 416)));
      height: min(calc(96vw * (416 / 480)), 96vh);
      max-width: 1000px;
      max-height: 866px;
      touch-action: none;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
