<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mosquito Swat - Reflex Net - Arcade Carnival</title>
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #2b2b36;
        color: #f1f2f6;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        max-width: 900px;
        max-height: 650px;
        background: #fdfbf7;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border-radius: 12px;
        overflow: hidden;
        cursor: crosshair;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="game-canvas"></canvas>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
