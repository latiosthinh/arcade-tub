<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kirby's Adventure — ArcadeTub</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        touch-action: none;
      }
      body {
        background: #2b2b2b;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      canvas {
        background: #000;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 100vh;
        aspect-ratio: 4 / 3;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" width="256" height="240"></canvas>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
