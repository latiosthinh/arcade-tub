<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Layered Cardboard / Papercraft Retro Arcade Icon -->
  <defs>
    <filter id="paper-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#2B2118"/>
    </filter>
  </defs>

  <!-- Base Cardboard Tile -->
  <rect x="6" y="6" width="50" height="50" rx="12" fill="#FAF6EE" stroke="#2B2118" stroke-width="3.5" filter="url(#paper-shadow)" />

  <!-- Inner Arcade Screen Frame -->
  <rect x="13" y="13" width="36" height="28" rx="6" fill="#1E293B" stroke="#2B2118" stroke-width="2" />

  <!-- Screen Glow / Wave Arc -->
  <path d="M 16 35 Q 31 18 46 35" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <circle cx="31" cy="24" r="4" fill="#FF2E93" />

  <!-- D-Pad / Controller Buttons on Craft Body -->
  <!-- Directional Cross -->
  <path d="M 18 48 L 24 48 M 21 45 L 21 51" stroke="#2B2118" stroke-width="2.5" stroke-linecap="round" />

  <!-- Action Gem Buttons -->
  <circle cx="41" cy="49" r="2.8" fill="#F59E0B" stroke="#2B2118" stroke-width="1.5" />
  <circle cx="47" cy="46" r="2.8" fill="#10B981" stroke="#2B2118" stroke-width="1.5" />
</svg>